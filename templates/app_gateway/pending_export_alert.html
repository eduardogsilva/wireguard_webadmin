{% load i18n %}
{% if pending_export %}
<div class="alert alert-warning d-flex justify-content-between align-items-center">
    <span>
        <i class="icon fas fa-exclamation-triangle"></i>
        {% trans 'There are changes that have not been exported to Caddy yet.' %}
    </span>
    <form method="post" action="{% url 'export_caddy_config' %}" class="d-inline mb-0">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <button type="submit" class="btn btn-sm btn-light">
            <i class="fas fa-file-export"></i> {% trans 'Export now' %}
        </button>
    </form>
</div>
{% endif %}
